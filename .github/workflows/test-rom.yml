name: Johto test ROM

on:
  workflow_dispatch:
  push:
    branches: [master, upcoming]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-rom:
    name: Build playable Johto test ROM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev python3

      - name: Validate HGSS map geography and walking paths
        run: python3 tools/generations_maps/validate.py

      - name: Build ROM with progression shortcuts enabled
        run: make -j"$(nproc)" -O all BUILD_NAME=generations-progression GENERATIONS_TEST_ROM=1

      - name: Verify ROM and generate checksum
        shell: bash
        run: |
          test "$(stat -c '%s' pokegenerations-progression.gba)" -eq 33554432
          sha256sum pokegenerations-progression.gba > pokegenerations-progression.sha256
          {
            echo '### Johto test ROM'
            echo 'Download **pokemon-generations-johto-test** from the Artifacts section of this run.'
            echo 'Extract the ZIP and open `pokegenerations-progression.gba` in mGBA.'
            echo 'The scientist in the Pallet bedroom applies the shortcut and gives one shiny level-30 Mew.'
            echo 'The scientist in New Bark applies the Johto shortcut and gives one shiny level-30 Celebi.'
            echo 'With a full party, make room and talk again to receive the pending gift.'
            echo 'After receiving Mew, speak to the sailor in Pallet to travel to Johto; Oak’s introduction remains available.'
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'SHA-256:'
            cat pokegenerations-progression.sha256
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload playable test ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-generations-johto-test
          path: |
            pokegenerations-progression.gba
            pokegenerations-progression.sha256
          if-no-files-found: error
          retention-days: 30
